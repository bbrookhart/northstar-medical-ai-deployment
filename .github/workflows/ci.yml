name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"
          python-version: "3.13.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Validate governance traceability and evidence report
        run: uv run python scripts/validate_traceability.py --check

      - name: Run the retrieval evaluation set and check the generated report
        run: uv run python scripts/evaluate_retrieval.py --check

      - name: Check the release supply-chain policy and generated SBOM/AIBOM
        run: uv run python scripts/supply_chain.py --check

      - name: Run the adversarial campaign and check the release evaluation
        run: uv run python scripts/red_team.py --check

      - name: Execute the operational game-day drills
        run: uv run python scripts/operations.py --check

      - name: Assemble the audit package and execute the retirement exercise
        run: uv run python scripts/lifecycle.py --check

      - name: Verify that portfolio and training claims trace to artifacts
        run: uv run python scripts/portfolio.py --check

      - name: Verify synthetic dataset integrity and safety
        run: uv run python scripts/synthetic_fhir.py verify

      - name: Verify formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Run tests and enforce coverage
        run: uv run pytest --cov=polaris --cov-report=term-missing
