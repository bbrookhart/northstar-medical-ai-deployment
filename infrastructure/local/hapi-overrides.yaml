spring:
  ai:
    mcp:
      server:
        enabled: false
  jpa:
    open-in-view: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

hapi:
  fhir:
    openapi_enabled: false
    fhir_version: R4
    ig_runtime_upload_enabled: false
    bulk_export_enabled: false
    bulk_import_enabled: false
    delete_enabled: false
    expunge_enabled: false
    graphql_enabled: false
    allow_external_references: false
    allow_multiple_delete: false
    store_meta_source_information: SOURCE_URI
    cors:
      allow_Credentials: false
      allowed_origin:
        - "http://127.0.0.1:18080"
    subscription:
      resthook_enabled: false
      websocket_enabled: false
    mdm_enabled: false
    cr:
      enabled: false
    cdshooks:
      enabled: false
    tester:
      home:
        name: Northstar local synthetic FHIR lab
        server_address: "http://127.0.0.1:18080/fhir"
        refuse_to_fetch_third_party_urls: true
        fhir_version: R4
