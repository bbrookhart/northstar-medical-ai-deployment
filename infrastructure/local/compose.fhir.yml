name: northstar-polaris-fhir-lab

services:
  hapi-fhir:
    image: hapiproject/hapi:v8.10.0-3@sha256:55213612779ab3eeec919226b7bad378f0061ade823393a61d7dd46dd5087a3d
    container_name: northstar-hapi-fhir
    user: "65532:65532"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 3g
    cpus: 2.0
    restart: "no"
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/northstar-overrides.yaml
    volumes:
      - ./hapi-overrides.yaml:/app/config/northstar-overrides.yaml:ro
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "HealthCheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 45s
    networks:
      - isolated-fhir

networks:
  isolated-fhir:
    driver: bridge
